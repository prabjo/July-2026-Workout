<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIIT Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="hiit">
  <div class="page-wrap">
    <div id="app-nav"></div>

    <header class="hero">
      <h1>HIIT Timer</h1>
      <p class="subtitle">Prep · Work · Rest · Rounds · Phone-friendly</p>
    </header>

    <div class="card">
      <div class="preset-row">
        <button class="preset active" onclick="applyPreset(10,40,20,4,this)">40 / 20 × 4</button>
        <button class="preset" onclick="applyPreset(10,45,15,5,this)">45 / 15 × 5</button>
        <button class="preset" onclick="applyPreset(10,30,30,10,this)">30 / 30 × 10</button>
        <button class="preset" onclick="applyPreset(5,20,10,8,this)">20 / 10 × 8</button>
      </div>
    </div>

    <div class="card">
      <div class="grid-2">
        <div class="input-box">
          <label for="prep">Prep (sec)</label>
          <input id="prep" type="number" min="0" value="10" />
        </div>
        <div class="input-box">
          <label for="work">Work (sec)</label>
          <input id="work" type="number" min="1" value="40" />
        </div>
        <div class="input-box">
          <label for="rest">Rest (sec)</label>
          <input id="rest" type="number" min="0" value="20" />
        </div>
        <div class="input-box">
          <label for="rounds">Rounds</label>
          <input id="rounds" type="number" min="1" value="4" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="timer-display">
        <div class="phase" id="phaseLabel">Ready</div>
        <div class="time-lg" id="timeDisplay">00:10</div>
        <div class="round" id="roundDisplay">Round 0 / 4</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-top">Next</div>
          <div class="stat-val" id="nextDisplay">Work</div>
        </div>
        <div class="stat">
          <div class="stat-top">Total</div>
          <div class="stat-val" id="totalDisplay">03:10</div>
        </div>
        <div class="stat">
          <div class="stat-top">Status</div>
          <div class="stat-val" id="statusDisplay">Idle</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="btn-row">
        <button class="btn start" onclick="startTimer()">Start</button>
        <button class="btn pause" onclick="pauseTimer()">Pause</button>
        <button class="btn skip" onclick="skipPhase()">Skip</button>
        <button class="btn reset" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <div class="card">
      <div class="note">
        Best use: set your work/rest, hit Start, and leave the phone screen open. Supports sound, vibration, and wake lock on supported phones.
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const hiit = {
      prep: 10,
      work: 40,
      rest: 20,
      rounds: 4,
      currentRound: 0,
      phase: 'ready',
      remaining: 10,
      duration: 10,
      running: false,
      interval: null,
      endAt: null,
      wakeLock: null,
      audioCtx: null
    };

    const phaseLabel = document.getElementById('phaseLabel');
    const timeDisplay = document.getElementById('timeDisplay');
    const roundDisplay = document.getElementById('roundDisplay');
    const nextDisplay = document.getElementById('nextDisplay');
    const totalDisplay = document.getElementById('totalDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressBar = document.getElementById('progressBar');

    function readInputs() {
      hiit.prep = Math.max(0, parseInt(document.getElementById('prep').value || 0, 10));
      hiit.work = Math.max(1, parseInt(document.getElementById('work').value || 1, 10));
      hiit.rest = Math.max(0, parseInt(document.getElementById('rest').value || 0, 10));
      hiit.rounds = Math.max(1, parseInt(document.getElementById('rounds').value || 1, 10));
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function totalSeconds() {
      readInputs();
      return hiit.prep + (hiit.work * hiit.rounds) + (hiit.rest * Math.max(0, hiit.rounds - 1));
    }

    function beep(freq = 880, duration = 0.12) {
      try {
        if (!hiit.audioCtx) hiit.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = hiit.audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.03;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !hiit.wakeLock) {
          hiit.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    async function releaseWakeLock() {
      try {
        if (hiit.wakeLock) {
          await hiit.wakeLock.release();
          hiit.wakeLock = null;
        }
      } catch (e) {}
    }

    function setPhase(phase, duration, round) {
      hiit.phase = phase;
      hiit.duration = duration;
      hiit.remaining = duration;
      if (typeof round === 'number') hiit.currentRound = round;
      render();
    }

    function sessionStart() {
      readInputs();
      hiit.currentRound = 0;
      if (hiit.prep > 0) {
        setPhase('prep', hiit.prep, 0);
      } else {
        setPhase('work', hiit.work, 1);
      }
    }

    function finishTimer() {
      clearInterval(hiit.interval);
      hiit.interval = null;
      hiit.running = false;
      hiit.phase = 'done';
      hiit.remaining = 0;
      hiit.duration = 1;
      beep(1000, 0.18);
      setTimeout(() => beep(1300, 0.18), 180);
      vibrate([160, 80, 160, 80, 160]);
      releaseWakeLock();
      render();
    }

    function advancePhase() {
      if (hiit.phase === 'prep') {
        setPhase('work', hiit.work, 1);
        beep(880, 0.15);
        vibrate([120, 50, 120]);
        return;
      }

      if (hiit.phase === 'work') {
        if (hiit.currentRound >= hiit.rounds) {
          finishTimer();
          return;
        }

        if (hiit.rest > 0 && hiit.currentRound < hiit.rounds) {
          setPhase('rest', hiit.rest, hiit.currentRound);
          beep(660, 0.12);
          vibrate(120);
          return;
        }

        if (hiit.currentRound < hiit.rounds) {
          setPhase('work', hiit.work, hiit.currentRound + 1);
          beep(880, 0.15);
          vibrate([120, 50, 120]);
          return;
        }

        finishTimer();
        return;
      }

      if (hiit.phase === 'rest') {
        const nextRound = hiit.currentRound + 1;
        if (nextRound <= hiit.rounds) {
          setPhase('work', hiit.work, nextRound);
          beep(880, 0.15);
          vibrate([120, 50, 120]);
          return;
        }
      }

      finishTimer();
    }

    function nextLabel() {
      if (hiit.phase === 'ready') return 'Work';
      if (hiit.phase === 'prep') return 'Work';
      if (hiit.phase === 'work') {
        if (hiit.currentRound >= hiit.rounds) return 'Done';
        return hiit.rest > 0 ? 'Rest' : 'Work';
      }
      if (hiit.phase === 'rest') return 'Work';
      return 'Restart';
    }

    function render() {
      timeDisplay.textContent = formatTime(hiit.remaining);
      roundDisplay.textContent = `Round ${hiit.currentRound} / ${hiit.rounds}`;
      totalDisplay.textContent = formatTime(totalSeconds());
      nextDisplay.textContent = nextLabel();

      let phaseText = 'Ready';
      if (hiit.phase === 'prep') phaseText = 'Prep';
      if (hiit.phase === 'work') phaseText = 'Work';
      if (hiit.phase === 'rest') phaseText = 'Rest';
      if (hiit.phase === 'done') phaseText = 'Done';
      phaseLabel.textContent = phaseText;

      if (hiit.phase === 'done') statusDisplay.textContent = 'Done';
      else if (hiit.running) statusDisplay.textContent = 'Running';
      else statusDisplay.textContent = 'Idle';

      const pct = hiit.duration > 0 ? ((hiit.duration - hiit.remaining) / hiit.duration) * 100 : 100;
      progressBar.style.width = Math.max(0, Math.min(100, pct)) + '%';
    }

    function tick() {
      const msLeft = hiit.endAt - Date.now();
      hiit.remaining = Math.max(0, Math.ceil(msLeft / 1000));
      render();

      if (msLeft <= 0) {
        advancePhase();
        if (hiit.phase !== 'done') {
          hiit.endAt = Date.now() + (hiit.duration * 1000);
        }
      }
    }

    function startTimer() {
      if (hiit.running) return;
      if (hiit.phase === 'ready' || hiit.phase === 'done') sessionStart();
      hiit.running = true;
      requestWakeLock();
      hiit.endAt = Date.now() + (hiit.remaining * 1000);
      clearInterval(hiit.interval);
      hiit.interval = setInterval(tick, 100);
      render();
    }

    function pauseTimer() {
      if (!hiit.running) return;
      clearInterval(hiit.interval);
      hiit.interval = null;
      hiit.running = false;
      hiit.remaining = Math.max(0, Math.ceil((hiit.endAt - Date.now()) / 1000));
      render();
    }

    function resetTimer() {
      clearInterval(hiit.interval);
      hiit.interval = null;
      hiit.running = false;
      readInputs();
      hiit.phase = 'ready';
      hiit.currentRound = 0;
      hiit.duration = hiit.prep > 0 ? hiit.prep : hiit.work;
      hiit.remaining = hiit.duration;
      progressBar.style.width = '0%';
      releaseWakeLock();
      render();
    }

    function skipPhase() {
      if (hiit.phase === 'ready') {
        sessionStart();
        return;
      }
      advancePhase();
      if (hiit.running && hiit.phase !== 'done') {
        hiit.endAt = Date.now() + (hiit.duration * 1000);
      }
      render();
    }

    function applyPreset(prep, work, rest, rounds, btn) {
      document.getElementById('prep').value = prep;
      document.getElementById('work').value = work;
      document.getElementById('rest').value = rest;
      document.getElementById('rounds').value = rounds;
      document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      resetTimer();
    }

    ['prep','work','rest','rounds'].forEach(id => {
      document.getElementById(id).addEventListener('input', resetTimer);
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && hiit.running) {
        await requestWakeLock();
      }
    });

    resetTimer();
  </script>
</body>
</html>
